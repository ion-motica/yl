<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Referință acolade — demo</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        padding: 1.25rem 1rem 2rem;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.35rem;
      }
      p.lead {
        margin: 0 0 1rem;
        color: #475569;
        line-height: 1.5;
        font-size: 0.92rem;
      }
      p.lead a {
        color: #2563eb;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 0.75rem;
        margin-bottom: 1rem;
      }
      .card {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 0.65rem 0.75rem 0.5rem;
      }
      .card h2 {
        margin: 0 0 0.35rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #64748b;
      }
      .card svg {
        width: 100%;
        height: 100px;
        display: block;
      }
      .random-panel {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 0.85rem 1rem 1rem;
      }
      .random-panel h2 {
        margin: 0 0 0.5rem;
        font-size: 1rem;
      }
      .random-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.65rem;
      }
      button {
        padding: 0.45rem 0.85rem;
        border-radius: 8px;
        border: 1px solid #94a3b8;
        background: #e2e8f0;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 600;
      }
      button:hover {
        background: #cbd5e1;
      }
      #randomMeta {
        font-family: "Courier New", monospace;
        font-size: 0.82rem;
        color: #334155;
      }
      #randomSvg {
        width: 100%;
        height: 140px;
        display: block;
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
      }
      .ref-acolada {
        fill: none;
        stroke: #0f172a;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Referință acolade</h1>
      <p class="lead">
        Cele 4 orientări (aceeași piesă, rotită). Detalii complete în
        <a href="referinta acolade - text.md">referinta acolade - text.md</a>.
      </p>

      <div class="grid" id="orientGrid"></div>

      <section class="random-panel">
        <h2>Dimensiune aleatoare</h2>
        <div class="random-row">
          <button type="button" id="btnRandom">Random lățime</button>
          <span id="randomMeta">—</span>
        </div>
        <svg id="randomSvg" aria-label="Acoladă random"></svg>
      </section>
    </main>

    <script src="referinta acolade.js"></script>
    <script>
      const RA = ReferintaAcolade;
      const labels = [
        [RA.ORIENT.JOS, "Deschisă în jos"],
        [RA.ORIENT.SUS, "Deschisă în sus"],
        [RA.ORIENT.STANGA, "Deschisă spre stânga"],
        [RA.ORIENT.DREAPTA, "Deschisă spre dreapta"],
      ];

      const grid = document.getElementById("orientGrid");
      for (const [orient, title] of labels) {
        const card = document.createElement("article");
        card.className = "card";
        const h = document.createElement("h2");
        h.textContent = title;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
        card.append(h, svg);
        grid.appendChild(card);
        RA.demoInViewBox(svg, 320, 100, orient, { span: 200, pad: 20 });
      }

      const randomSvg = document.getElementById("randomSvg");
      const randomMeta = document.getElementById("randomMeta");
      const orientations = [
        RA.ORIENT.JOS,
        RA.ORIENT.SUS,
        RA.ORIENT.STANGA,
        RA.ORIENT.DREAPTA,
      ];

      function drawRandom() {
        const span = 60 + Math.floor(Math.random() * 280);
        const orient = orientations[Math.floor(Math.random() * orientations.length)];
        randomSvg.replaceChildren();
        const info = RA.demoInViewBox(randomSvg, 640, 140, orient, {
          span,
          pad: 28,
        });
        randomMeta.textContent = `orient=${orient}  span=${span}px  R=${info.R.toFixed(2)}  L=${info.L.toFixed(2)}`;
      }

      document.getElementById("btnRandom").addEventListener("click", drawRandom);
      drawRandom();
    </script>
  </body>
</html>
