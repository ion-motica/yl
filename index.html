<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Youlearn</title>
    <link rel="stylesheet" href="style.css?v=79" />
  </head>
  <body>
    <div id="game" class="game">
      <!-- divArena = ecranul de telefon. Pe desktop intră în coloana 1 a tabelului. -->
      <div id="divArena" class="divArena">
        <div id="arena" class="arena">
          <div id="divInfo11_20" class="div-info-11-20" hidden aria-live="polite">
            <p class="info11-mode">Mod: —</p>
            <p class="info11-wrong">Facts greșite: —</p>
            <p class="info11-intensiv">Facts lucrate intensiv: —</p>
            <p class="info11-count">Întrebări: —</p>
            <p class="info11-sessions">Sesiuni intensiv: —</p>
            <div class="info11-times"></div>
          </div>
          <div id="div-strat-info" class="div-strat-info">
            <div class="info-antet">
              <p id="quiz-title" class="quiz-title">Tabla adunarii - Clasic - 1_10+1_10</p>
              <p id="level-info" class="level-info">Nivel 1 · 1+1..10</p>
              <p id="message" class="message" aria-live="assertive"></p>
            </div>
            <div id="div-ilustrare-din-arena" class="arena-ilustrare-din-arena">
              <span class="arena-zone-label">div ilustrare din arena</span>
              <div id="arena-question-slot" class="arena-question-slot" hidden aria-hidden="true"></div>
              <div class="arena-ilustrare-body" aria-live="polite"></div>
            </div>
            <div id="div-lista-operatii" class="arena-lista-operatii">
              <span class="arena-zone-label">div lista operatii</span>
              <div id="succession-list" class="succession-list" aria-label="Istoricul seriei"></div>
            </div>
          </div>

          <div id="div-strat-lift" class="div-strat-lift">
            <div id="falling" class="falling" aria-live="polite">
              <div class="falling-inner">
                <div id="div-ilustrare-in-lift" class="lift-ilustrare" hidden aria-hidden="true">
                  <span class="arena-zone-label">div ilustrare in lift</span>
                  <div class="lift-ilustrare-body" aria-live="polite"></div>
                </div>
                <div id="division-history" class="division-history" aria-label="Împărțiri efectuate"></div>
                <div class="progress-visual" aria-label="Progres nivel">
                  <div id="streak-track" class="streak-track" aria-label="Progres nivel"></div>
                  <div id="combo-track" class="combo-track" aria-label="Greșeli de recuperat"></div>
                </div>
                <div id="falling-main" class="falling-main">
                  <span id="top-number" class="number">—</span>
                </div>
                <div class="falling-options" aria-hidden="true">
                  <span class="falling-prime" data-slot="0">—</span>
                  <span class="falling-prime" data-slot="1">—</span>
                  <span class="falling-prime" data-slot="2">—</span>
                </div>
              </div>
            </div>
            <div id="rising" class="rising hidden" aria-hidden="true">
              <span id="rising-number" class="number"></span>
            </div>
          </div>

          <div id="div-strat-anunturi" class="div-strat-anunturi">
            <div id="flash" class="flash" aria-hidden="true"></div>
            <div id="level-banner" class="level-banner hidden" aria-live="assertive"></div>
          </div>
        </div>

        <div id="div-strat-butoane" class="div-strat-butoane">
          <div class="butoane-sus">
            <div class="hud-left">
              <button type="button" id="menu-toggle" class="menu-toggle" aria-label="Meniu" aria-expanded="false" title="Meniu">≡</button>
              <button type="button" id="cp-toggle" class="cp-toggle" aria-label="Panouri de control" aria-expanded="false" title="Panouri de control">CP</button>
            </div>
            <button type="button" id="play-pause" class="play-pause" aria-label="Pauză" title="Pauză (Space)">⏸</button>
          </div>
          <div id="lift-fixed-host" class="lift-fixed-host" hidden aria-hidden="true"></div>
          <div id="options" class="options" role="group" aria-label="Opțiuni răspuns">
            <button type="button" class="option" data-index="0" disabled>
              <kbd>1</kbd><span class="prime">—</span>
            </button>
            <button type="button" class="option" data-index="1" disabled>
              <kbd>2</kbd><span class="prime">—</span>
            </button>
            <button type="button" class="option" data-index="2" disabled>
              <kbd>3</kbd><span class="prime">—</span>
            </button>
          </div>
        </div>
      </div>

      <!-- divMeniu = meniul. Overlay pe mobil; coloana 2 pe desktop. -->
      <aside id="divMeniu" class="divMeniu">
        <div id="divButoaneNiveluri" class="divButoaneNiveluri">
          <div id="level-picker" class="level-picker" role="group" aria-label="Alege nivelul"></div>
        </div>
        <div id="divListaQuizuri" class="divListaQuizuri">
          <details id="quiz-picker" class="quiz-picker" open>
            <summary class="quiz-picker-summary">Quiz-uri</summary>
            <div id="quiz-picker-list" class="quiz-picker-list" role="listbox" aria-label="Lista quiz-uri"></div>
          </details>
        </div>
      </aside>

      <!-- divCp = panourile de control. Overlay pe mobil; coloana 3 pe desktop. -->
      <aside id="divCp" class="divCp cp-shell" hidden aria-label="Panouri de control">
        <div class="cp-shell-backdrop" hidden></div>
        <div class="cp-shell-panel">
          <button type="button" class="cp-shell-close" aria-label="Închide panourile de control" hidden>✕</button>
          <nav class="cp-toc" aria-label="Cuprins panouri"></nav>
          <div class="cp-sections"></div>
        </div>
      </aside>

      <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
      <button type="button" id="drawer-close" class="drawer-close" aria-label="Închide meniul" title="Închide meniul" hidden>✕</button>
    </div>

    <script src="js/speed-factors.js"></script>

    <script src="js/progress.js"></script>
    <script src="js/progress-display.js"></script>
    <script src="js/quiz-registry.js"></script>
    <script src="js/fact-catalog.js"></script>
    <script src="js/fact-stats.js"></script>
    <script src="js/fact-store.js"></script>
    <script src="js/quizzes/addition-table.js"></script>
    <script src="js/quizzes/addition-table-range.js"></script>
    <script src="js/quizzes/addition-table-singapore.js"></script>
    <script src="js/quizzes/addition-table-singapore-missing.js"></script>
    <script src="js/conexe-table-quiz/constants.js"></script>
    <script src="js/conexe-table-quiz/engine.js"></script>
    <script src="js/conexe-table-quiz/adapters/addition.js"></script>
    <script src="js/conexe-table-quiz/adapters/division.js"></script>
    <script src="js/conexe-table-quiz/adapters/subtraction.js"></script>
    <script src="js/conexe-table-quiz/adapters/multiplication.js"></script>
    <script src="js/succesive-quiz/mistake-registry.js"></script>
    <script src="js/succesive-quiz/speed-manager.js"></script>
    <script src="js/succesive-quiz/engine.js"></script>
    <script src="js/succesive-quiz/adapters/addition.js"></script>
    <script src="js/quizzes/addition-succesive-helper.js"></script>
    <script src="js/quizzes/addition-table-conexe-helper.js"></script>
    <script src="js/quizzes/division-table-conexe-helper.js"></script>
    <script src="js/quizzes/subtraction-table-conexe-helper.js"></script>
    <script src="js/quizzes/multiplication-table-conexe-helper.js"></script>
    <script src="js/quizzes/prime-divisors.js"></script>
    <script src="js/quizzes/prime-divisions.js"></script>
    <script src="js/quizzes/division-with-remainder.js"></script>
    <script src="js/quizzes/sub-sau-langa-radical.js"></script>
    <script src="js/quizzes/bagare-sub-radical.js"></script>
    <script src="js/eff/qf-generator.js"></script>
    <script src="js/eff/eff-profile-store.js"></script>
    <script src="js/eff/eff-mistake-registry.js"></script>
    <script src="js/eff/eff-modal.js"></script>
    <script src="js/eff-quiz/engine.js"></script>
    <script src="js/eff-quiz/adapters/addition.js"></script>
    <script src="js/eff-quiz/adapters/subtraction.js"></script>
    <script src="js/eff-quiz/adapters/multiplication.js"></script>
    <script src="js/eff-quiz/adapters/division.js"></script>
    <script src="js/quizzes/addition-eff-helper.js"></script>
    <script src="js/quizzes/subtraction-eff-helper.js"></script>
    <script src="js/quizzes/multiplication-eff-helper.js"></script>
    <script src="js/quizzes/division-eff-helper.js"></script>
    <script src="js/quizzes/multiplication-1120-v2.js?v=24"></script>
    <script src="axe acolade mere/axe acolade mere.js?v=2"></script>
    <script src="js/aam-arena.js?v=3"></script>
    <script src="js/layout-config.js"></script>
    <script src="js/asnw-profile.js?v=2"></script>
    <script src="js/asnw-onboarding.js?v=18"></script>
    <script src="js/startup-quiz.js"></script>

    <script src="js/cp-registry.js?v=23"></script>

    <script src="js/falling-engine.js?v=22"></script>
    <script src="js/app.js?v=60"></script>
  </body>
