name: YL Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  protected-files:
    name: protected-files
    runs-on: ubuntu-latest

    steps:
      - name: Check protected paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}

        run: |
          python3 <<'PY'
          import os
          import sys
          import json
          import base64
          import urllib.request

          token = os.environ["GH_TOKEN"]
          owner = os.environ["OWNER"]
          repo = os.environ["REPO"]
          pr_number = os.environ["PR_NUMBER"]

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "yl-guard",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          # 1. Citește sursa canonică din yl-guard.
          try:
              data = get_json(
                  f"https://api.github.com/repos/{owner}/yl-guard/"
                  "contents/protected-files.txt"
              )
              text = base64.b64decode(data["content"]).decode("utf-8")
          except Exception as exc:
              print("STOP — YL Guard nu poate citi protected-files.txt")
              print(exc)
              sys.exit(1)

          rules = []
          for line in text.splitlines():
              line = line.strip()
              if not line or line.startswith("#"):
                  continue
              rules.append(line)

          # 2. Citește toate fișierele modificate de PR.
          changed = []
          page = 1

          while True:
              files = get_json(
                  f"https://api.github.com/repos/{repo}/pulls/"
                  f"{pr_number}/files?per_page=100&page={page}"
              )

              if not files:
                  break

              for item in files:
                  changed.append(item["filename"])

                  # Detectează și vechiul nume la rename.
                  previous = item.get("previous_filename")
                  if previous:
                      changed.append(previous)

              if len(files) < 100:
                  break

              page += 1

          # 3. Compară diff-ul cu lista protejată.
          blocked = []

          for path in sorted(set(changed)):
              for rule in rules:
                  if rule.endswith("/"):
                      if path.startswith(rule):
                          blocked.append((path, rule))
                          break
                  elif path == rule:
                      blocked.append((path, rule))
                      break

          # 4. FAIL dacă a fost atins ceva protejat.
          if blocked:
              print()
              print("STOP — FIȘIER PROTEJAT MODIFICAT:")
              for path, rule in blocked:
                  print(f"  {path}   [regulă: {rule}]")
              print()
              print(
                  "Este necesar acord explicit pentru modificarea "
                  "infrastructurii protejate."
              )
              sys.exit(1)

# YL Guard red test              

          print("YL Guard OK — niciun fișier protejat modificat.")
          PY
