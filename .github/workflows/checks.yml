name: Checks

on:
  push:
  pull_request:

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm test
      - run: npm run check:docs
      - run: npm run check:encoding
      - run: npm run check:cp-optiuni
