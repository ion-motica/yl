<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axe, acolade, mere</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #eef2f7;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 1.25rem 1rem 2rem;
      }
      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.35rem;
      }
      p.lead {
        margin: 0 0 1rem;
        color: #475569;
        font-size: 0.92rem;
        line-height: 1.5;
      }
      #host {
        min-height: 680px;
      }
      .aam-app {
        display: grid;
        grid-template-columns: minmax(240px, 280px) 1fr;
        gap: 1rem;
        align-items: start;
      }
      @media (max-width: 820px) {
        .aam-app {
          grid-template-columns: 1fr;
        }
      }
      .aam-sidebar {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 0.9rem 1rem 1.1rem;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
      }
      .aam-sidebar h2 {
        margin: 0 0 0.75rem;
        font-size: 0.78rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #64748b;
      }
      .aam-row {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        margin-bottom: 0.75rem;
      }
      .aam-row label {
        font-size: 0.82rem;
        color: #334155;
      }
      .aam-row input[type="text"] {
        width: 100%;
        padding: 0.45rem 0.55rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-size: 1rem;
      }
      .aam-nav {
        display: flex;
        gap: 0.4rem;
      }
      .aam-nav button {
        flex: 1;
        padding: 0.35rem;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
        cursor: pointer;
      }
      .aam-nav button:hover {
        background: #e2e8f0;
      }
      .aam-switch-row {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        margin-bottom: 0.45rem;
        font-size: 0.84rem;
        line-height: 1.35;
        cursor: pointer;
      }
      .aam-switch-row input {
        margin-top: 0.15rem;
      }
      .aam-row select {
        padding: 0.4rem 0.5rem;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        background: #fff;
      }
      .aam-info {
        margin: 0.75rem 0 0;
        font-size: 0.78rem;
        color: #64748b;
        line-height: 1.45;
      }
      .aam-stage {
        background: #fff;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 0.75rem;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        min-height: 480px;
      }
      .aam-series-head {
        font-size: 0.82rem;
        font-weight: 600;
        color: #64748b;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.25rem 0.5rem 0.65rem;
        border-bottom: 1px solid #e2e8f0;
        margin-bottom: 0.5rem;
      }
      .aam-series-list {
        display: flex;
        flex-direction: column;
        gap: 0.55rem;
      }
      .aam-series-row {
        display: grid;
        grid-template-columns: minmax(120px, 168px) 1fr;
        gap: 0.65rem;
        align-items: stretch;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        background: #f8fafc;
        overflow: hidden;
      }
      .aam-series-row.has-unknown {
        border-color: #bfdbfe;
        background: #f0f9ff;
      }
      .aam-series-row.has-error {
        border-color: #fecaca;
      }
      .aam-series-eq {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0.65rem;
        font-family: "Courier New", monospace;
        font-size: clamp(1rem, 2.2vw, 1.35rem);
        font-weight: 700;
        letter-spacing: 0.03em;
        text-align: center;
        border-right: 1px solid #e2e8f0;
        background: #fff;
      }
      .aam-series-viz-wrap {
        min-width: 0;
        padding: 0.35rem 0.45rem;
        display: flex;
        align-items: center;
      }
      .aam-series-viz {
        width: 100%;
        height: auto;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }
      .aam-series-viz svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .aam-error {
        color: #b91c1c;
        font-size: 0.9rem;
        text-align: center;
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Axe, acolade, mere</h1>
      <p class="lead">
        Serie de 10 facts din tablele +/− (0–10): ecuația în stânga, axa cu acolade și obiecte
        în dreapta. Jumătate complete, jumătate cu <code>?</code>. Orice switch din panel
        actualizează toate vizualizările odată.
      </p>
      <div id="host"></div>
    </main>
    <script src="axe acolade mere.js"></script>
    <script>
      axeAcoladeMere(document.getElementById("host"), {
        seriesLength: 10,
        showAxaNumere: true,
        showNumereAxaNumere: true,
        showNumereAxaInJurulSegmentuluiMicDreapta: true,
        afiseazaObiecte: true,
        obiectAfisat: "mere",
        afiseazaAcoladeNumereMici: true,
        afiseazaAcoladaNumarMare: true,
        afiseazaNumarLaUnknown: false,
      });
    </script>
  </body>
</html>
